<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e24" />
      <stop offset="100%" stop-color="#111113" />
    </linearGradient>
    <radialGradient id="avatarGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FFC006" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#FFC006" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="silhouetteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3f3f46" />
      <stop offset="100%" stop-color="#27272a" />
    </linearGradient>
    <pattern id="dotGrid" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#f5f5f5" fill-opacity="0.06" />
    </pattern>
  </defs>

  <!-- Background Card -->
  <rect width="600" height="600" rx="36" fill="url(#avatarBgGrad)" />
  <rect width="600" height="600" rx="36" fill="url(#dotGrid)" />

  <!-- Ambient Glow -->
  <circle cx="300" cy="270" r="230" fill="url(#avatarGlow)" />

  <!-- Decorative Orbit Rings -->
  <circle cx="300" cy="270" r="190" fill="none" stroke="#FFC006" stroke-width="1.5" stroke-dasharray="8 8" stroke-opacity="0.3" />
  <circle cx="300" cy="270" r="140" fill="none" stroke="#f5f5f5" stroke-width="1" stroke-opacity="0.1" />

  <!-- Avatar Silhouette -->
  <!-- Head -->
  <circle cx="300" cy="210" r="75" fill="url(#silhouetteGrad)" stroke="#FFC006" stroke-width="2" stroke-opacity="0.4" />
  <!-- Body / Shoulders -->
  <path d="M160 460 C160 360, 230 330, 300 330 C370 330, 440 360, 440 460 Z" fill="url(#silhouetteGrad)" stroke="#f5f5f5" stroke-width="1.5" stroke-opacity="0.15" />

  <!-- Monogram Initials Badge on Chest -->
  <g transform="translate(265, 360)">
    <rect width="70" height="32" rx="16" fill="#FFC006" fill-opacity="0.15" stroke="#FFC006" stroke-width="1.5" />
    <text x="35" y="21" fill="#FFC006" font-family="Inter, -apple-system, sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1.5">PHOTO</text>
  </g>

  <!-- Bottom Helper Note -->
  <text x="300" y="525" fill="#a1a1aa" font-family="Inter, -apple-system, sans-serif" font-size="15" font-weight="500" text-anchor="middle" letter-spacing="0.5">
    Upload your portrait to replace this placeholder
  </text>
</svg>
